<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to chrisjohnson.solutions</title>
  <meta http-equiv="refresh" content="0;url=https://www.chrisjohnson.solutions/">
  <link rel="canonical" href="https://www.chrisjohnson.solutions/">
  <script>
    (function () {
      var prefix = '/chris-johnson-portfolio';
      var path = location.pathname || '/';
      if (path.indexOf(prefix) === 0) path = path.slice(prefix.length);
      if (!path) path = '/';
      location.replace('https://www.chrisjohnson.solutions' + path + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>This site has moved to <a href="https://www.chrisjohnson.solutions/">https://www.chrisjohnson.solutions/</a>.</p>
</body>
</html>
